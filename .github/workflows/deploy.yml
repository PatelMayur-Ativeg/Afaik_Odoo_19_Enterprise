name: Deploy Odoo Custom Addons

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Show deployment information
        run: |
          echo "======================================"
          echo "Starting Odoo deployment"
          echo "======================================"
          echo "Hostname:"
          hostname
          echo "User:"
          whoami

      - name: Sync custom addons
        run: |
          echo "Syncing custom addons..."

          rsync -av --delete \
            /home/ubantu/docker_odoo/Odoo_CI_CD/Afaik_Odoo_19_Enterprise/custom_addons/aafa-staging_new/ \
            /home/ubantu/docker_odoo/odoo-docker/custom_addons/aafa-staging_new/

          echo "Custom addons sync completed."

      - name: Show deployed addons
        run: |
          echo "Deployed custom addons:"
          ls -la /home/ubantu/docker_odoo/odoo-docker/custom_addons/aafa-staging_new

      - name: Build Odoo Docker image
        run: |
          cd /home/ubantu/docker_odoo/odoo-docker

          echo "Building Odoo image..."

          docker compose build odoo

      - name: Restart Odoo
        run: |
          cd /home/ubantu/docker_odoo/odoo-docker

          echo "Starting Odoo..."

          docker compose up -d odoo

      - name: Check containers
        run: |
          cd /home/ubantu/docker_odoo/odoo-docker

          echo "Container status:"
          docker compose ps

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Odoo deployment completed successfully"
          echo "======================================"
